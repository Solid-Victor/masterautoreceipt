<svg viewBox="0 0 640 530" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="640" height="530" fill="#000000"/>
  
  <!-- Red car silhouette -->
  <g transform="translate(50, 150)">
    <!-- Car body -->
    <path d="M 20 120 L 30 80 L 80 60 L 180 60 L 220 80 L 240 120 Z" fill="#FF0000" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Windows -->
    <rect x="50" y="75" width="40" height="25" fill="#FFFFFF" opacity="0.3"/>
    <rect x="130" y="75" width="40" height="25" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Wheels -->
    <circle cx="60" cy="125" r="15" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="200" cy="125" r="15" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Wheel details -->
    <circle cx="60" cy="125" r="8" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="200" cy="125" r="8" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    
    <!-- Red accent line -->
    <line x1="0" y1="140" x2="250" y2="140" stroke="#FF0000" stroke-width="4"/>
  </g>
  
  <!-- Text -->
  <g font-family="Arial, sans-serif" font-weight="bold">
    <!-- MASTER LUXURY -->
    <text x="320" y="200" font-size="48" fill="#FF0000" letter-spacing="2">MASTER</text>
    <text x="320" y="250" font-size="48" fill="#FF0000" letter-spacing="2">LUXURY</text>
    
    <!-- & FLEX -->
    <text x="320" y="300" font-size="42" fill="#FFFFFF" letter-spacing="1">&amp; FLEX</text>
    
    <!-- MASTERAUTZ -->
    <text x="50" y="420" font-size="32" fill="#FFFFFF" letter-spacing="3">MASTERAUTZ</text>
  </g>
</svg>
